
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5fa">
  <title>ดูอนิเมะ | Yume Anime</title>

  <style>
    :root {
      --pink: #ff78ad;
      --dark-pink: #ed5794;
      --bg: #fff8fb;
      --text: #493744;
      --muted: #927e8d;
      --border: #f4dce8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    a { text-decoration: none; color: inherit; }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1000px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      color: var(--dark-pink);
      font-size: 23px;
      font-weight: 900;
    }

    .logo span { color: var(--text); }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .breadcrumb {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      overflow-wrap: anywhere;
    }

    .breadcrumb a { color: var(--dark-pink); }

    .panel {
      padding: 22px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(205,111,157,.10);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(21px, 4vw, 30px);
      line-height: 1.4;
      margin: 5px 0;
      overflow-wrap: anywhere;
    }

    .muted { color: var(--muted); font-size: 14px; }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #201923;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player video,
    .player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #201923;
    }

    .player video { object-fit: contain; }

    .placeholder {
      color: white;
      text-align: center;
      padding: 25px;
    }

    .placeholder strong {
      display: block;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff0f6;
      color: #c73d7c;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--pink);
      color: white;
      border-color: var(--pink);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .episode-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .episode-link {
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      background: #fffafd;
      font-size: 13px;
      font-weight: 800;
    }

    .episode-link.active {
      background: #ffe5f0;
      border-color: var(--pink);
      color: var(--dark-pink);
    }

    .error {
      padding: 16px;
      border-radius: 12px;
      background: #fff4f7;
      color: #a13d6b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      background: white;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .panel { padding: 16px; border-radius: 17px; }
      .episode-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nav { padding: 12px 15px; }
    }

    @media (max-width: 360px) {
      .episode-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <a class="logo" href="index.html">Yume <span>Anime</span> ♡</a>
      <a class="btn" href="catalog.html">อนิเมะทั้งหมด</a>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb">
      <a href="index.html">หน้าแรก</a> ›
      <a href="catalog.html">อนิเมะทั้งหมด</a> ›
      <span id="crumbTitle">ดูอนิเมะ</span>
    </div>

    <section class="panel">
      <h1 id="watchTitle">กำลังโหลด...</h1>
      <div class="muted" id="watchSubtitle"></div>

      <div style="margin:18px 0 10px;font-weight:800" id="episodeHeading">
        เลือกตอนที่ต้องการดู
      </div>

      <div class="player" id="player">
        <div class="placeholder">
          <strong>♡ Yume Anime</strong>
          กำลังโหลดเครื่องเล่น...
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="playButton" type="button">
          ▶ เล่นในเว็บ
        </button>
        <a class="btn" id="externalButton" href="#" target="_blank"
           rel="noopener noreferrer" hidden>
          ↗ เปิดเว็บไซต์ภายนอก
        </a>
        <a class="btn" id="detailButton" href="catalog.html">
          ← กลับหน้ารายละเอียด
        </a>
      </div>

      <p class="muted" id="sourceNote">
        เลือกแหล่งรับชมที่มีให้บริการ
      </p>
      <div id="statusMessage"></div>
    </section>

    <section class="panel">
      <h2 style="font-size:19px;margin-top:0">♡ เลือกตอน</h2>
      <div class="actions" style="margin-top:0">
        <button class="btn" id="dubButton" type="button">พากย์ไทย</button>
        <button class="btn" id="subButton" type="button">ซับไทย</button>
      </div>
      <div class="episode-list" id="episodeList"></div>
    </section>
  </main>

  <footer>♡ Yume Anime — พื้นที่เล็ก ๆ สำหรับคนรักอนิเมะ ♡</footer>

  <script src="data.js"></script>
  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(location.search);
      const animeId = (params.get("anime") || "").trim();
      const episodeNumber = Math.max(1, parseInt(params.get("ep") || "1", 10) || 1);
      let language = params.get("lang") === "sub" ? "sub" : "dub";

      const animeList = Array.isArray(window.animeData)
        ? window.animeData
        : [];

      const anime = animeList.find(item =>
        String(item.id ?? "").trim() === animeId
      );

      const $ = id => document.getElementById(id);

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;",
          '"': "&quot;", "'": "&#39;"
        })[ch]);
      }

      function getSource(ep, lang) {
        const item = anime?.videos?.[ep]?.[lang];
        if (!item) return {};
        if (typeof item === "string") return { url: item, type: "mp4" };
        return item;
      }

      function getURL(source) {
        return typeof source.url === "string" ? source.url.trim() : "";
      }

      function getExternalURL(source) {
        return typeof source.externalUrl === "string"
          ? source.externalUrl.trim()
          : "";
      }

      function isHttpURL(url) {
        try {
          const parsed = new URL(url, location.href);
          return parsed.protocol === "https:" || parsed.protocol === "http:";
        } catch (_) {
          return false;
        }
      }

      function setMessage(message) {
        $("statusMessage").innerHTML = message
          ? `<div class="error">${esc(message)}</div>`
          : "";
      }

      function updateURL() {
        const next = new URL(location.href);
        next.searchParams.set("anime", animeId);
        next.searchParams.set("ep", String(episodeNumber));
        next.searchParams.set("lang", language);
        history.replaceState({}, "", next);
      }

      function playCurrent() {
        const source = getSource(episodeNumber, language);
        const url = getURL(source);
        const type = String(source.type || "mp4").toLowerCase();

        $("player").innerHTML = "";
        setMessage("");

        if (!url || !isHttpURL(url)) {
          $("player").innerHTML = `
            <div class="placeholder">
              <strong>ยังไม่มีวิดีโอของตอนนี้ ♡</strong>
              เพิ่ม URL วิดีโอที่เล่นได้ใน data.js ก่อนนะ
            </div>`;
          setMessage("ยังไม่มีลิงก์วิดีโอสำหรับ " +
            (language === "dub" ? "พากย์ไทย" : "ซับไทย") +
            " ตอนที่ " + episodeNumber + " สามารถเพิ่มลิงก์เว็บไซต์ภายนอกได้เช่นกัน");
          return;
        }

        if (type === "iframe") {
          const frame = document.createElement("iframe");
          frame.src = url;
          frame.title = "เครื่องเล่นอนิเมะ";
          frame.allow = "autoplay; fullscreen; picture-in-picture";
          frame.allowFullscreen = true;
          frame.referrerPolicy = "strict-origin-when-cross-origin";
          $("player").appendChild(frame);
          $("sourceNote").textContent =
            "หากเว็บไซต์ต้นทางไม่อนุญาตให้ฝังวิดีโอ ให้ใช้ปุ่มเปิดเว็บไซต์ภายนอก";
          return;
        }

        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";

        const src = document.createElement("source");
        src.src = url;

        if (type === "webm") {
          src.type = "video/webm";
        } else if (type === "m3u8") {
          src.type = "application/vnd.apple.mpegurl";
        } else {
          src.type = "video/mp4";
        }

        video.appendChild(src);
        video.addEventListener("error", function () {
          setMessage("เล่นวิดีโอไม่ได้ ลิงก์อาจไม่ถูกต้อง รูปแบบวิดีโอไม่รองรับ หรือเซิร์ฟเวอร์ต้นทางไม่อนุญาตให้เล่นจากเว็บนี้");
        });

        $("player").appendChild(video);
        $("sourceNote").textContent =
          "กดปุ่มเล่นบนวิดีโอ หากเล่นไม่ได้ ให้ตรวจสอบ URL และรูปแบบไฟล์";
      }

      function renderEpisodes() {
        const total = Math.max(0, Number(anime.episodes) || 0);
        const list = $("episodeList");
        list.innerHTML = "";

        if (!total) {
          list.innerHTML = '<div class="error">ยังไม่มีข้อมูลจำนวนตอนใน data.js</div>';
          return;
        }

        for (let ep = 1; ep <= total; ep++) {
          const link = document.createElement("a");
          link.className = "episode-link" + (ep === episodeNumber ? " active" : "");
          link.textContent = "ตอนที่ " + ep;
          link.href = "watch.html?anime=" + encodeURIComponent(animeId) +
            "&ep=" + ep + "&lang=" + language;
          list.appendChild(link);
        }
      }

      function updateLanguageButtons() {
        $("dubButton").classList.toggle("primary", language === "dub");
        $("subButton").classList.toggle("primary", language === "sub");

        const source = getSource(episodeNumber, language);
        const external = getExternalURL(source);

        $("externalButton").hidden = !(external && isHttpURL(external));
        $("externalButton").href =
          external && isHttpURL(external) ? external : "#";

        $("episodeHeading").textContent =
          "ตอนที่ " + episodeNumber + " · " +
          (language === "dub" ? "พากย์ไทย" : "ซับไทย");

        updateURL();
        renderEpisodes();
      }

      function setLanguage(nextLanguage) {
        language = nextLanguage;
        updateLanguageButtons();
        playCurrent();
      }

      if (!anime) {
        $("watchTitle").textContent = "ไม่พบข้อมูลอนิเมะ";
        $("watchSubtitle").textContent =
          "ตรวจสอบ ID ใน URL และข้อมูลใน data.js";
        $("player").innerHTML = `
          <div class="placeholder">
            <strong>ไม่พบอนิเมะเรื่องนี้</strong>
            <a class="btn" href="catalog.html">กลับไปหน้าอนิเมะทั้งหมด</a>
          </div>`;
        $("dubButton").disabled = true;
        $("subButton").disabled = true;
        $("playButton").disabled = true;
        $("detailButton").href = "catalog.html";
        return;
      }

      $("watchTitle").textContent = anime.title || "ดูอนิเมะ";
      $("watchSubtitle").textContent = anime.originalTitle || "";
      $("crumbTitle").textContent = anime.title || "ดูอนิเมะ";
      $("detailButton").href =
        "detail.html?id=" + encodeURIComponent(animeId);
      document.title = "ดู " + (anime.title || "อนิเมะ") + " | Yume Anime";

      $("dubButton").addEventListener("click", () => setLanguage("dub"));
      $("subButton").addEventListener("click", () => setLanguage("sub"));
      $("playButton").addEventListener("click", playCurrent);

      updateLanguageButtons();
      playCurrent();
    })();
  </script>
</body>
</html>
